<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website Translator</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header>
      <div class="title-row">
        <h1 id="page-title" class="page-title"></h1>
        <button id="translate" class="primary small" hidden
          title="Tự bấm nút &quot;Copy page&quot; / &quot;Copy Markdown&quot; nếu trang có; nếu không, hãy copy nội dung Markdown vào clipboard trước khi bấm.">Dịch trang này</button>
        <button id="sync" class="icon sync" type="button" aria-pressed="false"
          title="Đồng bộ cuộn với trang gốc theo tiêu đề" aria-label="Đồng bộ cuộn">⇅</button>
        <button id="settings" class="icon" title="Cài đặt" aria-label="Cài đặt">⚙</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>
    <main id="output" class="markdown" hidden></main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
